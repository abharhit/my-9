name: abharhit

# Minimal instance: Tailscale (exit node) + 9router ONLY.
# No Hermes, no h-dashboard, no PHP/Docker/SSH server.
#
# Self-chaining: the last steps of every run (a) sync the 9router DB back
# to this repo, then (b) dispatch the NEXT run of this same workflow with
# the MY_PAT secret. Because the dispatch uses a PAT (not GITHUB_TOKEN),
# GitHub accepts it as a real trigger — runs started by the plain
# GITHUB_TOKEN cannot trigger new runs, which is why an `on:`-only
# approach (e.g. workflow_run) cannot keep a chain alive on its own.
# A 6-hourly schedule acts as a rescue: if a run ever dies before its
# dispatch step, the next scheduled run restarts the chain. The
# concurrency group serializes everything, so a rescued run and a
# chained run never overlap (no duplicate Tailscale hostname, no
# sync-push race).
#
# TO STOP THE CHAIN: Actions tab -> abharhit -> "..." -> Disable workflow.
# (Cancelling one run is NOT a stop signal by design here: the sync step
# still runs, but the dispatch step is skipped on a cancelled job — so a
# manual cancel also breaks the chain and only the schedule rescue or a
# manual dispatch will start it again.)
#
# Startup delay: step 0 sleeps 10 minutes before anything else, so the
# PREVIOUS instance's `tailscale logout` (and the hostname release in
# the tailnet) is fully settled before this run claims the same
# hostname. Time budget: 10 (wait) + ~2 (setup) + 335 (keep-alive)
# + ~1 (sync + dispatch + logout) = ~348 min < timeout 355.

on:
  workflow_dispatch:
    inputs:
      chain:
        description: 'Dispatch the next run when this one ends (self-chain)'
        type: boolean
        default: true
        required: false
  schedule:
    # Rescue only — normally a chained run is already active and this
    # just queues behind it via the concurrency group.
    - cron: '17 */6 * * *'

concurrency:
  group: abharhit-lite
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      WF_NAME: abharhit
      REPO: abharhit/my-9

    steps:
      - name: 0. Wait 10 min for previous instance's Tailscale logout
        run: |
          echo '⏳ Waiting 10 minutes so the previous instance can fully log out of Tailscale and release the hostname...'
          sleep 600
          echo '✅ Wait over — proceeding'

      - name: 1. Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 2. Setup npm prefix (for the global 9router install)
        run: |
          mkdir -p ~/.npm-global
          npm config set prefix '~/.npm-global'
          echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> ~/.bashrc
          export PATH="$HOME/.npm-global/bin:$PATH"
          echo '✅ npm prefix set to ~/.npm-global'

      - name: 3. Connect Tailscale as Exit Node & Show Access Info
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="${{ env.WF_NAME }}" --advertise-exit-node --accept-routes --accept-dns

          # Enable IP forwarding (required for exit node to route traffic)
          echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p /etc/sysctl.conf

          TS_IP=$(sudo tailscale ip -4)
          echo "=================================================="
          echo "  >>> 9ROUTER IS LIVE ON TAILSCALE <<<"
          echo "  Tailscale IP  : $TS_IP"
          echo "  ------------------------------------------------"
          echo "  🔀 9Router: http://$TS_IP:20128  (dashboard)"
          echo "  🌍 Exit Node: Enabled (advertise-exit-node)"
          echo "=================================================="

      - name: 4. Install 9router globally and create symlink
        run: |
          npm install -g 9router
          if [ -f ~/.npm-global/bin/9router ]; then
            sudo ln -sf ~/.npm-global/bin/9router /usr/local/bin/9router
            echo '✅ 9router installed and symlinked to /usr/local/bin/9router'
          else
            echo '⚠️ 9router binary not found after installation'
          fi

      - name: 5. Restore 9router db backup & start hidden (tray)
        run: |
          export INITIAL_PASSWORD="${{ secrets.RUNNER_PASSWORD }}"
          # Make sure the data dir exists
          mkdir -p ~/.9router/db
          BACKUP_DIR="${GITHUB_WORKSPACE:-.}/9router"
          # Restore the backed-up state from the repo (committed in 9router/data.sqlite)
          if [ -f "$BACKUP_DIR/data.sqlite" ]; then
            cp "$BACKUP_DIR/data.sqlite" ~/.9router/db/data.sqlite
            echo '✅ Restored 9router data.sqlite from repo backup'
          else
            echo '⚠️ 9router/data.sqlite not found in repo — starting fresh'
          fi
          # Start 9router hidden in the background (tray mode) on the default port 20128.
          # --tray is the same "hide to background" option used interactively.
          nohup 9router --tray --skip-update -p 20128 > /tmp/9router.log 2>&1 &
          sleep 6
          if curl -fsS http://localhost:20128 > /dev/null 2>&1; then
            echo '✅ 9router is live on http://localhost:20128'
          else
            echo '⚠️ 9router did not come up — check /tmp/9router.log'
          fi

      - name: 6. Keep-Alive (5h 35m)
        run: |
          for i in {1..335}; do
            sleep 60
            echo "[$i/335] 9router + Tailscale exit node active..."
          done

      - name: 7. Sync 9router data back to my-9
        if: always()
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          cd "${GITHUB_WORKSPACE:-.}"
          git config user.name "abharhit"
          git config user.email "abharhit@users.noreply.github.com"
          # Authenticate with PAT for push
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/abharhit/my-9.git"

          # Copy the 9router database back to the repo (the ONLY state
          # this minimal instance has — no hermes/ sync any more)
          mkdir -p 9router
          if [ -f ~/.9router/db/data.sqlite ]; then
            cp ~/.9router/db/data.sqlite 9router/data.sqlite
            echo '✅ Copied 9router data.sqlite → 9router/ for backup'
          fi

          # Commit & push if anything changed
          if git diff --quiet && git diff --cached --quiet; then
            echo 'ℹ️ No changes to commit'
          else
            git add 9router/ 2>/dev/null || true
            git commit -m "Sync 9router data from abharhit instance"
            # Pull first in case another run pushed before us
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "${{ github.ref_name }}" || echo '⚠️ Push failed — changes saved locally'
            echo '✅ 9router data synced to my-9'
          fi

      # Runs only on a NON-cancelled job: a manual cancel is treated as
      # "stop", so it deliberately does NOT dispatch a successor.
      # Placed AFTER the sync step so the next run's checkout already
      # contains the 9router DB this run just pushed.
      - name: 8. Trigger next run (self-chain)
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
          CHAIN: ${{ inputs.chain }}
        run: |
          if [ "$CHAIN" = "false" ]; then
            echo 'ℹ️ chain=false — not dispatching a successor. Start the chain again manually or wait for the schedule rescue.'
            exit 0
          fi
          gh workflow run abharhit.yml --repo "$REPO" --ref "${{ github.ref_name }}"
          echo '✅ Next abharhit run dispatched — the chain continues'
          echo 'ℹ️ To stop the chain for good: Actions tab -> abharhit -> Disable workflow'

      - name: 9. Tailscale Logout (cleanup on shutdown)
        if: always()
        run: |
          sudo tailscale logout || true
          echo "✅ Tailscale logout executed — hostname freed"
